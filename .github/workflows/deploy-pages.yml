# Deploy do GitHub Pages — só o último deploy vence.
# concurrency + cancel-in-progress: um push novo cancela o deploy que ainda
# estiver rodando; fica de pé apenas a publicação do commit mais recente.
#
# O pacote publica SOMENTE os arquivos do jogo. Antes, o passo de empacotamento
# mandava o repositório inteiro (path: '.'), e por isso a pasta tests/ e o
# .gitignore ficavam acessíveis publicamente no site.
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      # Cópia explícita: só o que o jogador precisa baixar para jogar offline.
      - name: Selecionar arquivos do jogo
        run: |
          mkdir -p _site
          cp index.html README.md _site/
          # Falha cedo se o jogo não entrar no pacote.
          test -s _site/index.html
          echo "Publicando:" && ls -la _site
      - name: Empacotar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
